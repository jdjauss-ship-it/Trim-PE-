<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trim PE</title>
    <link rel="stylesheet" href="style.css">
</head><body><div class="overlay"></div>

<main class="app">

    <header class="header">
        <h1>TRIM PE</h1>
        <p>by WindX</p>
        <span>Minecraft Bedrock/Pocket World Trimmer</span>
    </header>

    <section class="menu">

        <button class="menu-btn" onclick="selectWorld()">
            📁 <span>Select World</span>
        </button>

        <button class="menu-btn" onclick="trimWorld()">
            ✂️ <span>Trim World</span>
        </button>

        <button class="menu-btn" onclick="backupWorld()">
            💾 <span>Backup World</span>
        </button>

        <button class="menu-btn" onclick="openSettings()">
            ⚙️ <span>Settings</span>
        </button>

        <button class="menu-btn about-btn" onclick="openAbout()">
            ℹ️ <span>About</span>
        </button>

    </section>

    <footer>
        <p>Trim PE • Developed by WindX</p>
    </footer>

</main>

<script src="script.js"></script>

</body>
  </html>
